[project]
name = "hengxin-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "pydantic-settings>=2.10,<3",
  "uvicorn==0.35.0",
  "sqlalchemy==2.0.51",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]==5.6.3",
  "minio>=7.2,<8",
  "python-multipart>=0.0.20,<1",
  "pillow>=12.1,<13",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an isolated PostgreSQL test database"]
