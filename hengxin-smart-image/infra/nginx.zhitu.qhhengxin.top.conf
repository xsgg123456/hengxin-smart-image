server {
    listen 80;
    server_name zhitu.qhhengxin.top;

    access_log /www/sites/zhitu/log/access.log main;
    error_log /www/sites/zhitu/log/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/zhitu/www;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://zhitu.qhhengxin.top$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zhitu.qhhengxin.top;

    access_log /www/sites/zhitu/log/access.log main;
    error_log /www/sites/zhitu/log/error.log;

    ssl_certificate /www/sites/zhitu/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/zhitu/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 75s;
    }
}
