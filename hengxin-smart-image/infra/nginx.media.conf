# Opt-in SINGLE gateway. Shared zones coordinate all its worker processes.
# Replicating this gateway requires a new global admission design.
limit_conn_zone $server_name zone=media_images:32k;
limit_conn_zone $server_name zone=media_uploads:32k;
limit_conn_zone $server_name zone=media_zips:32k;
# X-Accel-Redirect can retain the API cache header across error_page. Add only
# when absent, so a storage error does not duplicate the no-store directive.
map $sent_http_cache_control $media_error_cache_control {
    default '';
    '' 'private, no-store';
}
log_format media_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
upstream media_api { server media-api:8000; keepalive 8; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log media_safe;
    client_max_body_size 11m;
    client_body_timeout 15s;
    send_timeout 15s;
    limit_conn_status 429;
    error_page 429 = @media_busy;
    # $request_uri retains the original public target across internal redirects.
    # Reject encoded dot-segment attempts before normalized URI can reach the SPA.
    if ($request_uri ~ "^/__hx_media") { return 404; }

    location ~ ^/api/v1/(api-image-edits/)?files/[^/]+/content/?$ {
        limit_conn media_images 32;
        proxy_pass http://media_api;
        proxy_set_header X-Hengxin-Media-Gateway 1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 35s;
        proxy_cache off;
        proxy_buffering off;
    }
    location ~ ^/api/v1/(api-image-edits/)?files/?$ {
        limit_conn media_uploads 2;
        proxy_pass http://media_api;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_request_buffering on;
        proxy_read_timeout 75s;
        proxy_cache off;
        proxy_max_temp_file_size 0;
    }
    location ~ ^/api/v1/(files/download-zip|api-image-edits/tasks/[^/]+/zip)/?$ {
        limit_conn media_zips 2;
        proxy_pass http://media_api;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 180s;
        proxy_cache off;
        proxy_buffering off;
    }
    location /__hx_media/ {
        internal;
        # Never log presigned arguments, including errors with upstream URLs.
        access_log off;
        error_log /dev/null crit;
        rewrite ^/__hx_media(/.*)$ $1 break;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host minio:9000;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_cache off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_ignore_client_abort off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_hide_header X-Amz-Request-Id;
        proxy_hide_header X-Amz-Id-2;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Disposition;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options nosniff always;
        proxy_intercept_errors on;
        error_page 416 =416 @media_invalid_range;
        error_page 400 403 404 405 500 502 503 504 =503 @media_unavailable;
    }
    location @media_invalid_range {
        default_type application/json;
        add_header Cache-Control $media_error_cache_control always;
        add_header Content-Range $upstream_http_content_range always;
        return 416 '{"code":"INVALID_RANGE","message":"图片范围无效"}';
    }
    location @media_unavailable {
        default_type application/json;
        add_header Cache-Control $media_error_cache_control always;
        return 503 '{"code":"MEDIA_UNAVAILABLE","message":"图片暂时不可读取，请稍后重试"}';
    }
    location @media_busy {
        default_type application/json;
        add_header Cache-Control $media_error_cache_control always;
        add_header Retry-After 1 always;
        return 429 '{"code":"MEDIA_BUSY","message":"媒体通道繁忙，请稍后重试"}';
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Hengxin-Media-Gateway '';
        proxy_hide_header X-Accel-Redirect;
        proxy_ignore_headers X-Accel-Redirect;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 75s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
