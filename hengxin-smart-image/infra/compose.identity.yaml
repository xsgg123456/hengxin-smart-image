name: hengxin-identity

services:
  identity-redis:
    image: redis:8.8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    environment:
      REDIS_PASSWORD: ${IDENTITY_REDIS_PASSWORD:?required}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    networks: [identity]
    volumes: [identity_redis:/data]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
  identity-api:
    image: ${IDENTITY_APP_IMAGE:-hengxin-smart-image-backend:identity-local}
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    command: ['uvicorn', 'app.identity.main:app', '--host', '0.0.0.0', '--port', '8000', '--no-access-log']
    networks: [identity]
    ports: ['127.0.0.1:${IDENTITY_HTTP_PORT:-8012}:8000']
    environment:
      IDENTITY_REDIS_URL: redis://:${IDENTITY_REDIS_PASSWORD:?required}@identity-redis:6379/0
      IDENTITY_PUBLIC_ORIGIN: ${IDENTITY_PUBLIC_ORIGIN:?required}
      IDENTITY_DOMESTIC_SERVICE_KEY: ${IDENTITY_DOMESTIC_SERVICE_KEY:?required}
      IDENTITY_OVERSEAS_SERVICE_KEY: ${IDENTITY_OVERSEAS_SERVICE_KEY:?required}
      IDENTITY_DINGTALK_CORP_ID: ${IDENTITY_DINGTALK_CORP_ID:-}
      IDENTITY_DINGTALK_CLIENT_ID: ${IDENTITY_DINGTALK_CLIENT_ID:-}
      IDENTITY_DINGTALK_AGENT_ID: ${IDENTITY_DINGTALK_AGENT_ID:-}
      IDENTITY_DINGTALK_CLIENT_SECRET: ${IDENTITY_DINGTALK_CLIENT_SECRET:-}
    depends_on:
      identity-redis: {condition: service_healthy}

networks:
  identity: {internal: false}
volumes:
  identity_redis:
