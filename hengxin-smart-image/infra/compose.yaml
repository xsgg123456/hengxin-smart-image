name: hengxin-smart-image

x-app: &app
  image: hengxin-smart-image-backend:phase8
  build:
    context: ..
    dockerfile: infra/Dockerfile.backend
  init: true
  restart: unless-stopped
  environment: &environment
    APP_ENV: ${APP_ENV:-development}
    ENABLE_DEV_IDENTITY: ${ENABLE_DEV_IDENTITY:-false}
    DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-4000-8000-000000000001}
    DEV_USER_NAME: ${DEV_USER_NAME:-本地联调用户}
    DEV_USER_ROLE: ${DEV_USER_ROLE:-operator}
    MINIO_BUCKET: ${MINIO_BUCKET:-hengxin-smart-image}
    ENABLE_TEST_JOBS: ${ENABLE_TEST_JOBS:-false}
    ENABLE_FIXTURE_EXECUTOR: ${ENABLE_FIXTURE_EXECUTOR:-false}
    GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-1}
    FIXTURE_DELAY_SECONDS: ${FIXTURE_DELAY_SECONDS:-3}
    SKILL_INSTALL_ROOT: /var/lib/hengxin/skills
    WORKER_NODE_NAME: worker-1
    DATABASE_URL: postgresql+psycopg://hengxin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/hengxin
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    MINIO_SECURE: 'false'
    OUTBOX_REDISPATCH_SECONDS: '10'
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_DB: hengxin
      POSTGRES_USER: hengxin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ['127.0.0.1:${POSTGRES_PORT:-55433}:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hengxin -d hengxin']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    ports:
      - '127.0.0.1:${MINIO_PORT:-59002}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-59003}:9001'
    volumes: [minio_data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports: ['127.0.0.1:${API_PORT:-8008}:8000']
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health/ready", timeout=8)']
      interval: 10s
      timeout: 10s
      retries: 6
  worker:
    <<: *app
    volumes: [skill_data:/var/lib/hengxin/skills]
    command: ['celery', '-A', 'app.worker.celery_app:celery_app', 'worker', '--loglevel=INFO', '--concurrency=1']
    healthcheck:
      test: ['CMD-SHELL', 'celery -A app.worker.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5']
      interval: 30s
      timeout: 10s
      retries: 3
  outbox:
    <<: *app
    command: ['python', '-m', 'app.worker.outbox']

volumes:
  postgres_data:
  redis_data:
  minio_data:
  skill_data:
