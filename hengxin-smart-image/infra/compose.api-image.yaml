# Optional overlay: docker compose -f compose.yaml -f compose.api-image.yaml ...
# Build a current backend image first. This overlay never changes the CLI worker.
x-api-environment: &api-environment
  API_IMAGE_ENABLED: '${API_IMAGE_ENABLED:-false}'
  API_IMAGE_API_KEY: '${API_IMAGE_API_KEY:-}'
  API_IMAGE_BASE_URL: '${API_IMAGE_BASE_URL:-https://api.qhhengxin.top}'
  API_IMAGE_BROKER_URL: 'redis://redis:6379/1'
  API_IMAGE_REQUEST_TIMEOUT_SECONDS: '${API_IMAGE_REQUEST_TIMEOUT_SECONDS:-180}'
  API_IMAGE_DOWNLOAD_TIMEOUT_SECONDS: '${API_IMAGE_DOWNLOAD_TIMEOUT_SECONDS:-60}'
  API_IMAGE_MAX_DOWNLOAD_BYTES: '${API_IMAGE_MAX_DOWNLOAD_BYTES:-20971520}'
  API_IMAGE_ALLOWED_RESULT_HOSTS: '${API_IMAGE_ALLOWED_RESULT_HOSTS:-["cdn3.dmiapi.com"]}'
  API_IMAGE_LEASE_SECONDS: '${API_IMAGE_LEASE_SECONDS:-360}'
x-api-service: &api-service
  image: ${APP_IMAGE:-hengxin-smart-image-backend:phase8}
  init: true
  restart: unless-stopped
  environment:
    <<: *api-environment
    APP_ENV: '${APP_ENV:-development}'
    ENABLE_CODEX_EXECUTOR: 'false'
    ENABLE_FIXTURE_EXECUTOR: 'false'
    DATABASE_URL: 'postgresql+psycopg://hengxin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/hengxin'
    MINIO_ENDPOINT: 'minio:9000'
    MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}'
    MINIO_SECRET_KEY: '${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}'
    MINIO_BUCKET: '${MINIO_BUCKET:-hengxin-smart-image}'
    MINIO_SECURE: 'false'
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
services:
  api:
    environment:
      <<: *api-environment
  api-image-worker:
    <<: *api-service
    command: ['celery', '-A', 'app.modules.api_image_edits.celery_app:celery_app', 'worker', '-Q', 'api_image_edits', '--concurrency=5', '--hostname=api-image@%h', '--loglevel=WARNING']
  api-image-outbox:
    <<: *api-service
    command: ['python', '-m', 'app.modules.api_image_edits.outbox']
