# Opt-in AFTER compose.yaml, compose.vps.yaml and optional compose.api-image.yaml.
# A single web gateway owns shared admission zones. Do not scale web or media-api.
# No production rollout until the full host/paid-result reservation budget passes.
services:
  api:
    environment:
      MEDIA_INTERNAL_DELIVERY_ENABLED: 'false'
      DB_POOL_SIZE: '5'
      DB_MAX_OVERFLOW: '0'
  media-api:
    extends:
      file: compose.yaml
      service: api
    image: ${APP_IMAGE:-hengxin-smart-image-backend:phase8}
    ports: !reset []
    environment:
      MEDIA_INTERNAL_DELIVERY_ENABLED: 'true'
      DB_POOL_SIZE: '4'
      DB_MAX_OVERFLOW: '0'
      ENABLE_CODEX_EXECUTOR: 'false'
      ENABLE_FIXTURE_EXECUTOR: 'false'
      API_IMAGE_ENABLED: '${API_IMAGE_ENABLED:-false}'
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--no-access-log']
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    tmpfs: ['/tmp:size=1280m,mode=1777']
  web:
    volumes:
      - ./nginx.media.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      media-api:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
